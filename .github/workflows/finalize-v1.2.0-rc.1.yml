name: Build ULTRON 1.2.0 release candidate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare ULTRON 1.2.0 release candidate'
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      ULTRON_ARCH: arm64
      ULTRON_CODESIGN_IDENTITY: '-'
      ULTRON_NOTARIZE: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: ./scripts/bootstrap.sh

      - name: Verify source and local boundaries
        run: |
          python scripts/repository-hygiene.py
          backend/.venv/bin/python -m py_compile backend/auth.py backend/email_service.py backend/external_apps.py backend/launcher.py backend/main.py backend/memory.py backend/printer_service.py backend/research.py backend/skills_api.py backend/skills_engine.py
          backend/.venv/bin/python scripts/security-smoke-test.py
          backend/.venv/bin/python scripts/location-lookup-test.py
          backend/.venv/bin/python scripts/fabrication-integration-test.py
          npm --prefix frontend run lint
          node --check desktop/main.cjs
          node --check desktop/forge.config.cjs

      - name: Build release candidate
        run: ./scripts/release-macos-arm64.sh

      - name: Publish clean source
        id: source
        run: |
          ASSET_DIR="${RUNNER_TEMP}/ultron-release-assets"
          mkdir -p "$ASSET_DIR"
          cp -a desktop/release/. "$ASSET_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git rm -- .github/workflows/finalize-v1.2.0-rc.1.yml
          git commit -m "ULTRON 1.2.0 final candidate source"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:main"
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        env:
          FINAL_SHA: ${{ steps.source.outputs.sha }}
          ASSET_DIR: ${{ steps.source.outputs.asset_dir }}
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          ZIP_ARCHIVE="$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.zip"
          ZIP_CHECKSUM="$ZIP_ARCHIVE.sha256"
          DMG_ARCHIVE="$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.dmg"
          DMG_CHECKSUM="$DMG_ARCHIVE.sha256"
          CHECKSUM_MANIFEST="$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64-SHA256SUMS.txt"
          gh release create v1.2.0-rc.1 \
            "$DMG_ARCHIVE" "$DMG_CHECKSUM" \
            "$ZIP_ARCHIVE" "$ZIP_CHECKSUM" \
            "$CHECKSUM_MANIFEST" \
            --target "$FINAL_SHA" \
            --title "ULTRON $VERSION — Apple Silicon final candidate" \
            --prerelease \
            --notes-file .github/release-notes/macos-arm64-preview.md
