name: Build ULTRON 1.1.0 release candidate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare ULTRON 1.1.0 release candidate'
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      ULTRON_ARCH: arm64
      ULTRON_CODESIGN_IDENTITY: '-'
      ULTRON_NOTARIZE: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: ./scripts/bootstrap.sh

      - name: Verify source and local boundaries
        run: |
          python scripts/repository-hygiene.py
          backend/.venv/bin/python scripts/security-smoke-test.py
          backend/.venv/bin/python scripts/location-lookup-test.py
          npm --prefix frontend run lint
          node --check desktop/main.cjs
          node --check desktop/forge.config.cjs

      - name: Build release candidate
        run: ./scripts/release-macos-arm64.sh

      - name: Publish clean source
        id: source
        run: |
          ASSET_DIR="${RUNNER_TEMP}/ultron-release-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a desktop/release/. "$ASSET_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git switch --orphan clean-main
          rm -f .github/workflows/finalize-v1.1.0-rc.1.yml
          git add -A
          git commit -m "ULTRON 1.1.0 final candidate source"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push --force origin "HEAD:main"
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        env:
          FINAL_SHA: ${{ steps.source.outputs.sha }}
          ASSET_DIR: ${{ steps.source.outputs.asset_dir }}
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          gh release create v1.1.0-rc.1             "$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.dmg"             "$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.dmg.sha256"             "$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.zip"             "$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64.zip.sha256"             "$ASSET_DIR/ULTRON-ai-$VERSION-macos-arm64-SHA256SUMS.txt"             --target "$FINAL_SHA"             --title "ULTRON $VERSION — Apple Silicon final candidate"             --prerelease             --notes-file .github/release-notes/macos-arm64-preview.md
