name: Publish Windows x64 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag, for example v1.2.1-windows.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: true
        type: boolean
      sign:
        description: Sign executables and Setup.exe with the configured Windows certificate
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # An unsigned installer remains a clearly-labelled candidate. It must
      # never be published as a normal public release because Windows SmartScreen
      # will not have a publisher identity to verify.
      - name: Validate release visibility
        if: ${{ !inputs.sign && !inputs.prerelease }}
        shell: pwsh
        run: |
          throw 'An unsigned Windows package can only be published as a pre-release.'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/pip.exe install -r requirements.txt

      - name: Install frontend and desktop dependencies
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Verify source and security boundaries
        shell: pwsh
        run: |
          python scripts/repository-hygiene.py
          backend/.venv/Scripts/python.exe -m py_compile backend/auth.py backend/email_service.py backend/external_apps.py backend/launcher.py backend/main.py backend/memory.py backend/printer_service.py backend/research.py backend/skills_api.py backend/skills_engine.py
          backend/.venv/Scripts/python.exe scripts/security-smoke-test.py
          backend/.venv/Scripts/python.exe scripts/location-lookup-test.py
          backend/.venv/Scripts/python.exe scripts/fabrication-integration-test.py
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/forge.config.cjs
          node scripts/verify-windows-config.mjs
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix desktop audit --omit=dev --audit-level=high
          npm --prefix frontend run lint

      - name: Materialize Windows signing certificate
        if: inputs.sign
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.ULTRON_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'ULTRON_WINDOWS_CERTIFICATE_BASE64 is required when sign is true.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ultron-windows-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "ULTRON_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, verify and archive
        shell: pwsh
        env:
          ULTRON_WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.sign && secrets.ULTRON_WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if ('${{ inputs.sign }}' -eq 'true') {
            ./scripts/release-windows-x64.ps1 -RequireSignature
          } else {
            ./scripts/release-windows-x64.ps1
          }

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultron-windows-x64-${{ github.sha }}
          path: desktop/release/ULTRON-ai-*-windows-x64-*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          TAG: ${{ inputs.release_tag }}
          PRE_RELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
          SIGNED: ${{ inputs.sign && 'true' || 'false' }}
        run: |
          $version = (node -e "process.stdout.write(require(process.argv[1]).version)" desktop/package.json).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read the desktop package version.'
          }
          $assets = @(
            "desktop/release/ULTRON-ai-$version-windows-x64-Setup.exe",
            "desktop/release/ULTRON-ai-$version-windows-x64-Setup.exe.sha256",
            "desktop/release/ULTRON-ai-$version-windows-x64.zip",
            "desktop/release/ULTRON-ai-$version-windows-x64.zip.sha256",
            "desktop/release/ULTRON-ai-$version-windows-x64-SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected release asset is missing: $asset"
            }
          }
          $notesFile = if ($env:SIGNED -eq 'true') {
            '.github/release-notes/cross-platform-official.md'
          } else {
            '.github/release-notes/cross-platform-candidate.md'
          }
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes file is missing: $notesFile"
          }
          $existingPreRelease = & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease --jq '.isPrerelease' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingPreRelease.Trim() -ne $env:PRE_RELEASE) {
              throw 'Existing release visibility does not match this workflow input. Use a new tag when moving from a candidate to a normal release.'
            }
            & gh release upload $env:TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $releaseArguments = @(
              'release', 'create', $env:TAG
            ) + $assets + @(
              '--target', $env:GITHUB_SHA,
              '--title', "ULTRON $version",
              '--notes-file', $notesFile,
              '--repo', $env:GITHUB_REPOSITORY
            )
            if ($env:PRE_RELEASE -eq 'true') {
              $releaseArguments += '--prerelease'
            }
            & gh @releaseArguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed with exit code $LASTEXITCODE."
          }

      - name: Remove temporary certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:ULTRON_WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath $env:ULTRON_WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -LiteralPath $env:ULTRON_WINDOWS_CERTIFICATE_FILE -Force
          }
